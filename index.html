<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        body {
            background-color: #ffc0cb; /* Light pink */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8b0040; /* Deep pink */
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            color: rgba(219, 112, 147, 0.3); /* Pale violet red with transparency */
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .App {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background-color: #ffb6c1; /* Light pink */
            border-radius: 0; /* Square edges */
            padding: 30px;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.3); /* Pale violet red shadow */
            border: 5px solid #ff69b4; /* Hot pink border */
            position: relative;
            z-index: 1;
        }

        .App-header {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .App-logo {
            height: 280px;
            width: 280px;
            object-fit: cover;
            border-radius: 0; /* Square edges */
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(219, 112, 147, 0.4);
            border: 5px solid #ff1493; /* Deep pink */
            transition: transform 0.3s ease;
        }

        .App-logo:hover {
            transform: scale(1.03);
        }

        .message {
            font-size: 36px;
            margin-bottom: 40px;
            min-height: 50px;
            font-weight: bold;
            color: #c71585; /* Medium violet red */
            padding: 15px 25px;
            background-color: #ffe4e9; /* Very light pink */
            border: 3px solid #ff69b4; /* Hot pink */
            border-radius: 0; /* Square edges */
            transition: all 0.3s ease;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 0; /* Square edges */
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            min-height: 70px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: translateY(1px);
        }

        .yes {
            background-color: #4CAF50; /* Solid green */
            color: white;
            border: 3px solid #388E3C; /* Darker green border */
        }

        .yes:hover {
            background-color: #45a049; /* Slightly darker green on hover */
        }

        .no {
            background-color: #f44336; /* Solid red */
            color: white;
            border: 3px solid #d32f2f; /* Darker red border */
        }

        .no:hover {
            background-color: #e53935; /* Slightly darker red on hover */
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            color: #8b0040; /* Deep pink */
            width: 100%;
            background-color: #ffe4e9; /* Very light pink */
            border-radius: 0; /* Square edges */
            border: 3px solid #ff69b4; /* Hot pink */
        }

        .footer a {
            color: #c71585; /* Medium violet red */
            text-decoration: none;
            transition: color 0.3s;
            font-weight: bold;
        }

        .footer a:hover {
            color: #8b0040; /* Deep pink */
            text-decoration: underline;
        }

        .seo {
            display: none;
        }

        .valentine-heart {
            font-size: 40px;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
            color: #ff1493; /* Deep pink */
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 600px) {
            .App-logo {
                height: 220px;
                width: 220px;
            }
            
            .message {
                font-size: 28px;
                padding: 12px 20px;
            }
            
            button {
                padding: 15px 30px;
                font-size: 20px;
                min-width: 130px;
                min-height: 60px;
            }
            
            .buttons-container {
                gap: 20px;
                flex-direction: row;
            }
            
            .valentine-heart {
                font-size: 30px;
            }
        }

        @media (max-width: 400px) {
            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }
            
            button {
                width: 200px;
            }
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { transform: scale(1); }
            25% { transform: scale(1.3) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(5deg); }
            75% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: scale(1); }
        }

        .hooray {
            animation: hooray 0.8s ease-in-out 3;
            color: #ff1493; /* Deep pink */
            background-color: #ffd1dc; /* Light pink */
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes logoHeartbeat {
            0% { transform: scale(1); border-color: #ff1493; }
            50% { transform: scale(1.05); border-color: #ff69b4; }
            100% { transform: scale(1); border-color: #ff1493; }
        }

        .heartbeat {
            animation: logoHeartbeat 1s infinite;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.6);
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="App">
        <header class="App-header">
            <div class="valentine-heart">💖</div>
            <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            <p id="message" class="message">Will you be my valentine? 💕</p>
            <div class="buttons-container">
                <button id="yesButton" class="yes">
                    Yes 💖
                </button>
                <button id="noButton" class="no">
                    No 💔
                </button>
            </div>
        </header>
        
        <div class="footer">
            <a href="http://fathomless-bayou-60027.herokuapp.com/">
                <small>
                    💖 By Jerard Louis Dayanghirang Guevarra
                    <br/>
                    Click here to find me online!
                </small>
            </a>
            <br/>
            <small class="seo">
                An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
            </small>
        </div>
    </div>

    <script>
        // State variables
        let text = 'Will you be my valentine? 💕';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let yesSize = 24;
        let noSize = 24;
        const sure = [
            "Are you sure? 💔", 
            "Are you really sure? 😢", 
            "Are you really REALLY sure??? 😭", 
            "Are you SURE you're sure that you're sure??? 💔😭"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const heartsContainer = document.getElementById('heartsContainer');

        // Create floating hearts
        function createHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❣️', '❤️', '🧡', '💛', '💚', '💙', '💜'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${Math.random() * 20 + 15}px`;
                heartsContainer.appendChild(heart);
            }
        }

        // Update button sizes
        function updateButtonSizes() {
            // Yes button gets bigger
            yesButton.style.fontSize = `${yesSize}px`;
            yesButton.style.padding = `${yesSize * 0.8}px ${yesSize * 1.5}px`;
            yesButton.style.minWidth = `${yesSize * 6}px`;
            yesButton.style.minHeight = `${yesSize * 2.5}px`;
            
            // No button gets smaller (but not too small)
            const noButtonSize = Math.max(10, 24 - (yesSize - 24) / 2);
            noButton.style.fontSize = `${noButtonSize}px`;
            noButton.style.padding = `${noButtonSize * 0.8}px ${noButtonSize * 1.5}px`;
            noButton.style.minWidth = `${noButtonSize * 6}px`;
            noButton.style.minHeight = `${noButtonSize * 2.5}px`;
            
            // Update message font size to match yes button
            messageElement.style.fontSize = `${Math.min(48, yesSize + 12)}px`;
        }

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            // Add animation for HOORAY message
            if (newText.includes('HOORAY')) {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 2400);
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            // Add animation when yes is clicked
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                logoElement.classList.add('heartbeat');
            } else {
                logoElement.classList.remove('heartbeat');
            }
        }

        // Yes button click handler
        function yesClick() {
            updateText('HOORAY! You made me so happy! 💖😊');
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset button sizes
            yesSize = 24;
            noSize = 24;
            updateButtonSizes();
        }

        // No button click handler
        function noClick() {
            const num = Math.floor(Math.random() * 4);
            updateText(sure[num]);
            
            // Yes button gets bigger, No button gets smaller
            yesSize += 12;
            
            // Cap the maximum yes button size
            if (yesSize > 72) {
                yesSize = 72;
            }
            
            updateButtonSizes();
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonSizes();
            createHearts();
        });
    </script>
</body>
</html>
