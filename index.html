<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ff1493);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ff69b4' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: -1;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .App {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(255, 20, 147, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        .App-header {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .App-logo {
            height: 280px;
            width: 280px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(255, 20, 147, 0.4);
            border: 5px solid white;
            transition: transform 0.5s ease;
        }

        .App-logo:hover {
            transform: scale(1.03);
        }

        .message {
            font-size: 36px;
            margin-bottom: 40px;
            min-height: 50px;
            font-weight: bold;
            text-shadow: 3px 3px 0px rgba(255, 105, 180, 0.5);
            color: #fff;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 10px 20px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            min-height: 70px;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(2px);
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        button:hover::after {
            transform: translateX(0);
        }

        .yes {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: 3px solid #81C784;
            transition: all 0.5s ease;
        }

        .yes:hover {
            background: linear-gradient(135deg, #66BB6A, #388E3C);
        }

        .no {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
            border: 3px solid #ef9a9a;
            transition: all 0.5s ease;
        }

        .no:hover {
            background: linear-gradient(135deg, #ef5350, #d32f2f);
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 16px;
            color: white;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .footer a {
            color: #ffebee;
            text-decoration: none;
            transition: color 0.3s;
            font-weight: bold;
        }

        .footer a:hover {
            color: #fff;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .seo {
            display: none;
        }

        .valentine-heart {
            font-size: 40px;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 600px) {
            .App-logo {
                height: 220px;
                width: 220px;
            }
            
            .message {
                font-size: 28px;
            }
            
            button {
                padding: 15px 30px;
                font-size: 20px;
                min-width: 130px;
                min-height: 60px;
            }
            
            .buttons-container {
                gap: 20px;
                flex-direction: row;
            }
            
            .valentine-heart {
                font-size: 30px;
            }
        }

        @media (max-width: 400px) {
            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }
            
            button {
                width: 200px;
            }
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { transform: scale(1); }
            25% { transform: scale(1.3) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(5deg); }
            75% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: scale(1); }
        }

        .hooray {
            animation: hooray 0.8s ease-in-out 3;
            background: linear-gradient(45deg, #ff1493, #ff69b4, #ffb6c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes logoHeartbeat {
            0% { transform: scale(1); border-color: white; }
            50% { transform: scale(1.05); border-color: #ff69b4; }
            100% { transform: scale(1); border-color: white; }
        }

        .heartbeat {
            animation: logoHeartbeat 1s infinite;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="App">
        <header class="App-header">
            <div class="valentine-heart">💖</div>
            <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            <p id="message" class="message">Will you be my valentine? 💕</p>
            <div class="buttons-container">
                <button id="yesButton" class="yes">
                    Yes 💖
                </button>
                <button id="noButton" class="no">
                    No 💔
                </button>
            </div>
        </header>
        
        <div class="footer">
            <a href="http://gothasianboy.github.io/">
                <small>
                    <i class="fas fa-heart"></i> By Jerard Louis Dayanghirang Guevarra
                    <br/>
                    Click here to find me online! <i class="fas fa-external-link-alt"></i>
                </small>
            </a>
            <br/>
            <small class="seo">
                An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
            </small>
        </div>
    </div>

    <script>
        // State variables
        let text = 'Will you be my valentine? 💕';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let yesSize = 24;
        let noSize = 24;
        const sure = [
            "Are you sure? 💔", 
            "Are you really sure? 😢", 
            "Are you really REALLY sure??? 😭", 
            "Are you SURE you're sure that you're sure??? 💔😭"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const heartsContainer = document.getElementById('heartsContainer');

        // Create floating hearts
        function createHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❣️', '❤️', '🧡', '💛', '💚', '💙', '💜'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${Math.random() * 20 + 15}px`;
                heartsContainer.appendChild(heart);
            }
        }

        // Update button sizes
        function updateButtonSizes() {
            // Yes button gets bigger
            yesButton.style.fontSize = `${yesSize}px`;
            yesButton.style.padding = `${yesSize * 0.8}px ${yesSize * 1.5}px`;
            yesButton.style.minWidth = `${yesSize * 6}px`;
            yesButton.style.minHeight = `${yesSize * 2.5}px`;
            
            // No button gets smaller (but not too small)
            const noButtonSize = Math.max(10, 24 - (yesSize - 24) / 2);
            noButton.style.fontSize = `${noButtonSize}px`;
            noButton.style.padding = `${noButtonSize * 0.8}px ${noButtonSize * 1.5}px`;
            noButton.style.minWidth = `${noButtonSize * 6}px`;
            noButton.style.minHeight = `${noButtonSize * 2.5}px`;
            
            // Update message font size to match yes button
            messageElement.style.fontSize = `${Math.min(48, yesSize + 12)}px`;
        }

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            // Add animation for HOORAY message
            if (newText.includes('HOORAY')) {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 2400);
                
                // Create celebration hearts
                createCelebrationHearts();
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            // Add animation when yes is clicked
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                logoElement.classList.add('heartbeat');
            } else {
                logoElement.classList.remove('heartbeat');
            }
        }

        // Yes button click handler
        function yesClick() {
            updateText('HOORAY! You made me so happy! 💖😊');
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset button sizes
            yesSize = 24;
            noSize = 24;
            updateButtonSizes();
        }

        // No button click handler
        function noClick() {
            const num = Math.floor(Math.random() * 4);
            updateText(sure[num]);
            
            // Yes button gets bigger, No button gets smaller
            yesSize += 12;
            
            // Cap the maximum yes button size
            if (yesSize > 72) {
                yesSize = 72;
            }
            
            updateButtonSizes();
            
            // Log to console
            console.log(`Yes button size: ${yesSize}px, No button size: ${Math.max(10, 24 - (yesSize - 24) / 2)}px`);
        }

        // Create celebration hearts
        function createCelebrationHearts() {
            const celebrationContainer = document.createElement('div');
            celebrationContainer.style.position = 'fixed';
            celebrationContainer.style.top = '0';
            celebrationContainer.style.left = '0';
            celebrationContainer.style.width = '100%';
            celebrationContainer.style.height = '100%';
            celebrationContainer.style.pointerEvents = 'none';
            celebrationContainer.style.zIndex = '1000';
            document.body.appendChild(celebrationContainer);
            
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❤️'];
            
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.style.position = 'absolute';
                heart.style.fontSize = `${Math.random() * 30 + 20}px`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = '100%';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.opacity = '0.9';
                
                celebrationContainer.appendChild(heart);
                
                // Animate heart floating up
                const animation = heart.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(-${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 3000,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                // Remove heart after animation
                animation.onfinish = () => {
                    heart.remove();
                };
            }
            
            // Remove container after all hearts are gone
            setTimeout(() => {
                celebrationContainer.remove();
            }, 5000);
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonSizes();
            createHearts();
        });
    </script>
</body>
</html>
