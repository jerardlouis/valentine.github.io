<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #ffc0cb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8b0040;
            text-align: center;
            padding: 10px;
            position: relative;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 18px;
            color: rgba(219, 112, 147, 0.3);
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        .App {
            width: 100%;
            max-width: 500px;
            background-color: #ffb6c1;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(219, 112, 147, 0.3);
            border: 4px solid #ff69b4;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .App-header {
            min-height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
        }

        .App-logo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(219, 112, 147, 0.4);
            border: 4px solid #ff1493;
        }

        .message {
            font-size: 22px;
            margin-bottom: 25px;
            min-height: 40px;
            font-weight: bold;
            color: #c71585;
            padding: 12px 18px;
            background-color: #ffe4e9;
            border: 3px solid #ff69b4;
            border-radius: 10px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            min-height: 55px;
            flex: 1;
            max-width: 45%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: translateY(1px);
        }

        .yes {
            background-color: #4CAF50;
            color: white;
            border: 3px solid #388E3C;
        }

        .yes:hover {
            background-color: #45a049;
        }

        .no {
            background-color: #f44336;
            color: white;
            border: 3px solid #d32f2f;
        }

        .no:hover {
            background-color: #e53935;
        }

        .footer {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #8b0040;
            width: 100%;
            background-color: #ffe4e9;
            border-radius: 10px;
            border: 3px solid #ff69b4;
        }

        .footer a {
            color: #c71585;
            text-decoration: none;
            transition: color 0.3s;
            font-weight: bold;
        }

        .footer a:hover {
            color: #8b0040;
            text-decoration: underline;
        }

        .seo {
            display: none;
        }

        .valentine-heart {
            font-size: 30px;
            margin-bottom: 8px;
            animation: heartbeat 1.5s infinite;
            color: #ff1493;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .App {
                padding: 15px;
                max-width: 95%;
            }
            
            .App-logo {
                width: 180px;
                height: 180px;
                margin-bottom: 15px;
            }
            
            .message {
                font-size: 20px;
                padding: 10px 15px;
                margin-bottom: 20px;
            }
            
            .buttons-container {
                gap: 15px;
                flex-direction: row;
            }
            
            button {
                padding: 12px 20px;
                font-size: 16px;
                min-width: 110px;
                min-height: 50px;
                max-width: 45%;
            }
            
            .valentine-heart {
                font-size: 26px;
            }
            
            .footer {
                padding: 12px;
                font-size: 13px;
                margin-top: 20px;
            }
        }

        @media (max-height: 700px) {
            .App-logo {
                width: 160px;
                height: 160px;
            }
            
            .message {
                font-size: 18px;
                margin-bottom: 15px;
            }
            
            .buttons-container {
                margin-top: 15px;
            }
            
            .footer {
                margin-top: 15px;
                padding: 10px;
            }
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { transform: scale(1); }
            25% { transform: scale(1.2) rotate(-5deg); }
            50% { transform: scale(1.15) rotate(5deg); }
            75% { transform: scale(1.2) rotate(-5deg); }
            100% { transform: scale(1); }
        }

        .hooray {
            animation: hooray 0.8s ease-in-out 2;
            color: #ff1493;
            background-color: #ffd1dc;
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes logoHeartbeat {
            0% { transform: scale(1); border-color: #ff1493; }
            50% { transform: scale(1.03); border-color: #ff69b4; }
            100% { transform: scale(1); border-color: #ff1493; }
        }

        .heartbeat {
            animation: logoHeartbeat 1s infinite;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="App">
        <header class="App-header">
            <div class="valentine-heart">💖</div>
            <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            <p id="message" class="message">Will you be my valentine? 💕</p>
            <div class="buttons-container">
                <button id="yesButton" class="yes">
                    Yes 💖
                </button>
                <button id="noButton" class="no">
                    No 💔
                </button>
            </div>
        </header>
        
        <div class="footer">
            <a href="http://jerardlouis.github.io/">
                <small>
                    💖 By Jerard Louis Dayanghirang Guevarra
                    <br/>
                    Click here to find me online!
                </small>
            </a>
            <br/>
            <small class="seo">
                An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
            </small>
        </div>
    </div>

    <script>
        // State variables
        let text = 'Will you be my valentine? 💕';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let yesSize = 18;
        let noSize = 18;
        const sure = [
            "Are you sure? 💔", 
            "Really sure? 😢", 
            "Really REALLY sure??? 😭", 
            "SURE you're sure??? 💔😭"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const heartsContainer = document.getElementById('heartsContainer');

        // Create floating hearts
        function createHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❣️', '❤️'];
            
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${Math.random() * 12 + 12}px`;
                heartsContainer.appendChild(heart);
            }
        }

        // Update button sizes
        function updateButtonSizes() {
            // Cap maximum sizes for mobile
            const maxYesSize = window.innerWidth < 480 ? 36 : 42;
            const minNoSize = window.innerWidth < 480 ? 8 : 10;
            
            // Apply sizes with limits
            const currentYesSize = Math.min(yesSize, maxYesSize);
            const currentNoSize = Math.max(minNoSize, 18 - (yesSize - 18) / 3);
            
            yesButton.style.fontSize = `${currentYesSize}px`;
            yesButton.style.padding = `${currentYesSize * 0.7}px ${currentYesSize * 1.2}px`;
            yesButton.style.minWidth = `${currentYesSize * 5}px`;
            yesButton.style.minHeight = `${currentYesSize * 2}px`;
            
            noButton.style.fontSize = `${currentNoSize}px`;
            noButton.style.padding = `${currentNoSize * 0.7}px ${currentNoSize * 1.2}px`;
            noButton.style.minWidth = `${currentNoSize * 5}px`;
            noButton.style.minHeight = `${currentNoSize * 2}px`;
            
            // Update message font size to match yes button (capped)
            messageElement.style.fontSize = `${Math.min(28, currentYesSize + 6)}px`;
        }

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            // Add animation for HOORAY message
            if (newText.includes('HOORAY')) {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 1600);
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            // Add animation when yes is clicked
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                logoElement.classList.add('heartbeat');
            } else {
                logoElement.classList.remove('heartbeat');
            }
        }

        // Yes button click handler
        function yesClick() {
            updateText('HOORAY! You made me happy! 💖😊');
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset button sizes
            yesSize = 18;
            noSize = 18;
            updateButtonSizes();
        }

        // No button click handler
        function noClick() {
            const num = Math.floor(Math.random() * 4);
            updateText(sure[num]);
            
            // Yes button gets bigger, No button gets smaller
            yesSize += 8;
            
            updateButtonSizes();
        }

        // Handle window resize
        function handleResize() {
            updateButtonSizes();
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);
        window.addEventListener('resize', handleResize);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonSizes();
            createHearts();
        });
    </script>
</body>
</html>
