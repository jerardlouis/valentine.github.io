<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .App {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            background-color: #cf81ba;
            color: white;
            text-decoration: none;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        a {
            text-decoration: none;
            color: white;
        }

        a:hover {
            text-decoration: underline;
        }

        .seo {
            color: #cf81ba;
            display: none;
        }

        .App-logo {
            height: 40vmin;
            max-height: 300px;
            min-height: 200px;
            pointer-events: none;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(40, 23, 39, 0.4);
        }

        .message {
            font-size: calc(10px + 2vmin);
            margin-bottom: 30px;
            min-height: 40px;
            text-shadow: 0 2px 4px rgba(40, 23, 39, 0.3);
            padding: 0 20px;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            padding: 0 20px;
        }

        button {
            color: white;
            border-radius: 20%;
            box-shadow: 0 2px 4px rgb(40, 23, 39);
            padding: 12px 25px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            min-width: 80px; /* Prevent buttons from becoming too small */
            max-width: 300px; /* Prevent buttons from becoming too large */
            overflow: hidden; /* Keep text inside button */
            white-space: nowrap; /* Keep text on one line */
            text-overflow: ellipsis; /* Add ... if text overflows */
        }

        button:hover {
            color: rgba(255, 255, 255, 1);
            box-shadow: 0 5px 15px rgba(145, 92, 182, .4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .yes {
            background-color: green;
            transition: font-size 0.3s ease, padding 0.3s ease; /* Smooth size transitions */
        }

        .no {
            background-color: red;
        }

        .App-header {
            background-color: #cf81ba;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: calc(10px + 2vmin);
            color: white;
            padding: 20px;
            width: 100%;
            overflow: hidden; /* Prevent content from overflowing */
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            padding: 0 20px;
        }

        .footer small {
            display: block;
            margin-bottom: 10px;
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hooray {
            animation: hooray 0.5s ease-in-out 3;
            color: #fff;
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.05); }
            50% { transform: scale(1); }
            75% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .heartbeat {
            animation: heartbeat 1s infinite;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.6);
        }

        @media (max-width: 600px) {
            .App-logo {
                height: 40vmin;
                max-height: 250px;
            }
            
            .buttons-container {
                flex-direction: row; /* Keep buttons side by side on mobile */
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .yes, .no {
                width: 120px;
                padding: 15px 0;
                font-size: 14px;
            }
            
            .footer {
                position: relative;
                bottom: auto;
                margin-top: 30px;
                padding-bottom: 20px;
            }
        }

        @media (max-width: 400px) {
            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .yes, .no {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="App">
        <header class="App-header">
            <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            <p id="message" class="message">Will you be my valentine?</p>
            <div class="buttons-container">
                <button id="yesButton" class="yes">
                    Yes
                </button>
                <button id="noButton" class="no">
                    No
                </button>
            </div>
            
            <div class="footer">
                <a href="http://jerardlouis.github.io/">
                    <small>
                        By Jerard Louis Dayanghirang Guevarra
                        <br/>
                        Click here to find me online!
                    </small>
                </a>
                <br/>
                <small class="seo">
                    An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                    @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
                </small>
            </div>
        </header>
    </div>

    <script>
        // State variables (simulating React useState)
        let text = 'Will you be my valentine?';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let buttonSize = 16;
        const sure = [
            "Are you sure?", 
            "Are you really sure?", 
            "Are you really REALLY sure???", 
            "Are you SURE you're sure that you're sure???"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const buttonsContainer = document.querySelector('.buttons-container');

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            // Add animation for HOORAY message
            if (newText === 'HOORAY <3') {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 1500);
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            // Add animation when yes is clicked
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                logoElement.classList.add('heartbeat');
            } else {
                logoElement.classList.remove('heartbeat');
            }
        }

        // Function to update the yes button size
        function updateButtonSize(newSize) {
            buttonSize = newSize;
            
            // Cap the maximum button size to prevent overflow
            const maxSize = Math.min(newSize, 48); // Cap at 48px to prevent overflow
            
            // Update font size
            yesButton.style.fontSize = `${maxSize}px`;
            
            // Also adjust padding to keep button proportional
            const padding = Math.max(12, maxSize / 2);
            yesButton.style.padding = `${padding}px ${padding * 2}px`;
            
            console.log(`Yes button size: ${maxSize}px`);
        }

        // Yes button click handler
        function yesClick() {
            updateText('HOORAY <3');
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset button size
            updateButtonSize(16);
        }

        // No button click handler
        function noClick() {
            const num = Math.floor(Math.random() * 4);
            updateText(sure[num]);
            updateButtonSize(buttonSize + 36);
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonSize(buttonSize);
        });
    </script>
</body>
</html>
