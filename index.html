<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em" font-size=%2290%22>💖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            background: url('https://images2.alphacoders.com/135/1357958.png') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            position: relative;
            padding: 10px;
        }

        /* Fainter pink overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 182, 193, 0.4);
            backdrop-filter: blur(2px);
            z-index: 0;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 105, 180, 0.3);
            animation: float 10s infinite ease-in-out;
            text-shadow: 0 0 5px rgba(255, 20, 147, 0.2);
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) translateX(0) rotate(0deg); 
                opacity: 0.5;
            }
            25% { 
                transform: translateY(-30px) translateX(10px) rotate(10deg); 
                opacity: 0.7;
            }
            50% { 
                transform: translateY(-15px) translateX(-10px) rotate(-5deg); 
                opacity: 0.6;
            }
            75% { 
                transform: translateY(-40px) translateX(5px) rotate(15deg); 
                opacity: 0.7;
            }
        }

        .App {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.9), rgba(255, 105, 180, 0.9));
            border-radius: 25px;
            padding: 20px;
            box-shadow: 
                0 0 20px rgba(255, 105, 180, 0.3),
                0 8px 25px rgba(255, 20, 147, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
            border: 4px solid white;
            position: relative;
            z-index: 2;
            overflow: hidden;
            backdrop-filter: blur(5px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .App-header {
            min-height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
        }

        /* Glowing box around the gif - fainter */
        .gif-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 15px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 0 0 4px white,
                0 0 0 6px rgba(255, 105, 180, 0.3),
                0 0 20px rgba(255, 20, 147, 0.3),
                inset 0 0 15px rgba(255, 255, 255, 0.2);
            animation: gifGlow 2s ease-in-out infinite alternate;
            background: linear-gradient(45deg, rgba(255, 182, 193, 0.6), rgba(255, 105, 180, 0.6));
            padding: 8px;
            transition: all 0.5s ease;
        }

        @keyframes gifGlow {
            0% {
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 6px rgba(255, 105, 180, 0.3),
                    0 0 15px rgba(255, 20, 147, 0.2),
                    inset 0 0 10px rgba(255, 255, 255, 0.15);
            }
            100% {
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 6px rgba(255, 105, 180, 0.4),
                    0 0 25px rgba(255, 20, 147, 0.3),
                    inset 0 0 18px rgba(255, 255, 255, 0.25);
            }
        }

        .App-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid white;
        }

        .message {
            font-size: 22px;
            margin-bottom: 15px;
            min-height: 40px;
            font-weight: bold;
            color: white;
            padding: 12px 18px;
            background: linear-gradient(45deg, rgba(255, 20, 147, 0.7), rgba(255, 105, 180, 0.7));
            border: 3px solid white;
            border-radius: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 12px rgba(255, 20, 147, 0.2);
            transition: all 0.5s ease;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
            width: 100%;
            transition: all 0.5s ease;
            min-height: 100px;
        }

        .buttons-row {
            display: flex;
            flex-direction: row;
            gap: 15px;
            justify-content: center;
            align-items: center;
            width: 100%;
            transition: all 0.5s ease;
            position: relative;
        }

        button {
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 18px;
            padding: 15px 30px;
            min-height: 55px;
            flex: 1;
            max-width: 160px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            border-radius: 20px;
        }

        .yes {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: 3px solid #A5D6A7;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: auto;
        }

        .yes.growing {
            flex: none;
            width: auto;
            transition: all 0.5s ease;
        }

        .yes.full-width {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 100% !important;
            flex: none !important;
            font-size: 32px !important;
            min-height: 80px !important;
            border-radius: 25px !important;
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.6) !important;
        }

        .yes.overflowing {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            max-height: 100vh !important;
            font-size: 48px !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            border-radius: 0 !important;
            z-index: 1000 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 5px solid white !important;
            box-shadow: 0 0 60px rgba(76, 175, 80, 0.8) !important;
            animation: yesPulse 0.6s infinite alternate !important;
        }

        @keyframes yesPulse {
            0% {
                background: linear-gradient(135deg, #4CAF50, #2E7D32);
                transform: scale(1);
                box-shadow: 0 0 60px rgba(76, 175, 80, 0.8);
            }
            100% {
                background: linear-gradient(135deg, #66BB6A, #388E3C);
                transform: scale(1.05);
                box-shadow: 0 0 80px rgba(76, 175, 80, 1);
            }
        }

        .yes:hover {
            background: linear-gradient(135deg, #66BB6A, #388E3C);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
        }

        .no {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
            border: 3px solid #EF9A9A;
            opacity: 1;
            transition: all 0.5s ease;
            width: auto;
            flex: none;
        }

        .no:hover {
            background: linear-gradient(135deg, #EF5350, #D32F2F);
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .no.shrinking {
            opacity: 0.8;
            transform: scale(0.9);
        }

        .no.hidden {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            width: 0;
            padding: 0;
            margin: 0;
            border: none;
            min-height: 0;
            overflow: hidden;
            display: none;
        }

        .footer {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: white;
            width: 100%;
            background: linear-gradient(45deg, rgba(255, 20, 147, 0.6), rgba(255, 105, 180, 0.6));
            border-radius: 15px;
            border: 2px solid white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            z-index: 3;
            position: relative;
        }

        .footer a {
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .footer a:hover {
            color: #FFEBEE;
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .seo {
            display: none;
        }

        .valentine-heart {
            font-size: 28px;
            margin-bottom: 8px;
            animation: heartbeat 1.5s infinite;
            color: white;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.12); }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .App {
                padding: 12px;
                max-width: 95%;
                border-radius: 20px;
                max-height: 95vh;
            }
            
            .gif-container {
                width: 150px;
                height: 150px;
                margin-bottom: 12px;
            }
            
            .message {
                font-size: 18px;
                padding: 10px 14px;
                margin-bottom: 12px;
                border-radius: 12px;
            }
            
            .buttons-row {
                gap: 10px;
            }
            
            button {
                font-size: 16px;
                padding: 12px 20px;
                min-height: 50px;
                max-width: 140px;
            }
            
            .valentine-heart {
                font-size: 24px;
            }
            
            .footer {
                padding: 10px;
                font-size: 12px;
                margin-top: 12px;
                border-radius: 12px;
            }
            
            .yes.overflowing {
                font-size: 36px !important;
            }
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { 
                transform: scale(1); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.7), rgba(255, 105, 180, 0.7));
            }
            25% { 
                transform: scale(1.3) rotate(-5deg); 
                background: linear-gradient(45deg, rgba(255, 105, 180, 0.9), rgba(255, 20, 147, 0.9));
            }
            50% { 
                transform: scale(1.25) rotate(5deg); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.9), rgba(255, 182, 193, 0.9));
            }
            75% { 
                transform: scale(1.3) rotate(-5deg); 
                background: linear-gradient(45deg, rgba(255, 182, 193, 0.9), rgba(255, 105, 180, 0.9));
            }
            100% { 
                transform: scale(1); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.7), rgba(255, 105, 180, 0.7));
            }
        }

        .hooray {
            animation: hooray 0.8s ease-in-out 2;
            color: white;
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes logoHeartbeat {
            0% { 
                transform: scale(1); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 6px rgba(255, 105, 180, 0.3),
                    0 0 15px rgba(255, 20, 147, 0.2),
                    inset 0 0 10px rgba(255, 255, 255, 0.15);
            }
            50% { 
                transform: scale(1.03); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 6px rgba(255, 105, 180, 0.4),
                    0 0 25px rgba(255, 20, 147, 0.3),
                    inset 0 0 15px rgba(255, 255, 255, 0.25);
            }
            100% { 
                transform: scale(1); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 6px rgba(255, 105, 180, 0.3),
                    0 0 15px rgba(255, 20, 147, 0.2),
                    inset 0 0 10px rgba(255, 255, 255, 0.15);
            }
        }

        .heartbeat {
            animation: logoHeartbeat 1s infinite;
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="App">
        <header class="App-header">
            <div class="valentine-heart">💖</div>
            <div class="gif-container">
                <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            </div>
            <p id="message" class="message">Will you be my valentine? 💕</p>
            <div class="buttons-container" id="buttonsContainer">
                <div class="buttons-row" id="buttonsRow">
                    <button id="yesButton" class="yes">
                        Yes 💖
                    </button>
                    <button id="noButton" class="no">
                        No 💔
                    </button>
                </div>
            </div>
        </header>
        
        <div class="footer" id="footer">
            <a href="https://jerardlouis.github.io" target="_blank">
                <small>
                    💖 By Jerard Louis Dayanghirang Guevarra
                    <br/>
                    Click here to find me online!
                </small>
            </a>
            <br/>
            <small class="seo">
                An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
            </small>
        </div>
    </div>

    <script>
        // State variables
        let text = 'Will you be my valentine? 💕';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let noClickCount = 0;
        const sure = [
            "Are you sure?", 
            "Are you really sure?", 
            "Are you really REALLY sure???", 
            "Are you SURE you're sure that you're sure???"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const buttonsRow = document.getElementById('buttonsRow');
        const gifContainer = document.querySelector('.gif-container');
        const heartsContainer = document.getElementById('heartsContainer');
        const footer = document.getElementById('footer');
        const app = document.querySelector('.App');

        // Create floating hearts
        function createHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❣️', '❤️'];
            
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 8}s`;
                heart.style.fontSize = `${Math.random() * 12 + 10}px`;
                heartsContainer.appendChild(heart);
            }
        }

        // Update button sizes and layout
        function updateButtonLayout() {
            const containerWidth = buttonsContainer.offsetWidth;
            
            // Calculate growth stages (6-7 clicks total)
            const totalClicks = 6; // Target 6 clicks to fill screen
            const currentStage = Math.min(noClickCount, totalClicks);
            const stageProgress = currentStage / totalClicks; // 0 to 1
            
            // Update Yes button (gradually gets wider)
            if (noClickCount < totalClicks) {
                // Yes button is growing but No button still visible
                yesButton.classList.remove('overflowing');
                yesButton.classList.add('growing');
                
                // Calculate Yes button width progression
                const minWidth = 160; // Starting width
                const maxWidth = containerWidth * 0.95; // Almost full container width
                const currentWidth = minWidth + (maxWidth - minWidth) * stageProgress;
                
                // Calculate font size progression
                const minFontSize = 18;
                const maxFontSize = 30;
                const currentFontSize = minFontSize + (maxFontSize - minFontSize) * stageProgress;
                
                // Apply styles to Yes button
                yesButton.style.width = `${currentWidth}px`;
                yesButton.style.fontSize = `${currentFontSize}px`;
                yesButton.style.padding = `${currentFontSize * 0.8}px ${currentFontSize * 1.5}px`;
                yesButton.style.minHeight = `${currentFontSize * 2}px`;
                
                // Update No button (gradually gets smaller)
                const noShrinkFactor = 1 - stageProgress;
                const noFontSize = Math.max(10, 18 * noShrinkFactor);
                
                noButton.classList.remove('hidden');
                noButton.style.display = 'flex';
                noButton.style.width = `${160 * noShrinkFactor}px`;
                noButton.style.fontSize = `${noFontSize}px`;
                noButton.style.padding = `${noFontSize * 0.6}px ${noFontSize * 1.2}px`;
                noButton.style.minHeight = `${noFontSize * 1.8}px`;
                noButton.style.opacity = `${noShrinkFactor}`;
                noButton.style.transform = `scale(${noShrinkFactor})`;
                
                // Switch to column layout when Yes button gets wide enough
                if (currentWidth > containerWidth * 0.6) {
                    buttonsRow.style.flexDirection = 'column';
                    buttonsRow.style.gap = '10px';
                    buttonsRow.style.alignItems = 'center';
                } else {
                    buttonsRow.style.flexDirection = 'row';
                    buttonsRow.style.gap = '15px';
                }
                
                // When Yes button is almost full width, make it full-width
                if (currentWidth > containerWidth * 0.9) {
                    yesButton.classList.add('full-width');
                    yesButton.style.width = '100%';
                } else {
                    yesButton.classList.remove('full-width');
                }
                
                // Keep other content visible
                gifContainer.style.opacity = '1';
                messageElement.style.opacity = '1';
                app.style.opacity = '1';
                footer.style.opacity = '1';
                
            } else {
                // No button is completely gone (6+ clicks)
                noButton.classList.add('hidden');
                noButton.style.display = 'none';
                messageElement.textContent = "You can't say no anymore! 😭💘";
                
                // Yes button takes over the screen
                yesButton.classList.remove('growing', 'full-width');
                yesButton.classList.add('overflowing');
                
                // Hide other elements
                gifContainer.style.opacity = '0.2';
                messageElement.style.opacity = '0.2';
                app.style.opacity = '0.3';
                footer.style.opacity = '0.2';
            }
            
            // Keep message size constant
            messageElement.style.fontSize = '22px';
            messageElement.style.padding = '12px 18px';
            messageElement.style.minHeight = '40px';
            
            // Ensure footer stays visible
            ensureFooterVisibility();
        }

        // Ensure footer stays in view
        function ensureFooterVisibility() {
            const appHeight = app.offsetHeight;
            const windowHeight = window.innerHeight;
            
            if (appHeight > windowHeight * 0.9) {
                app.style.overflowY = 'auto';
                app.style.maxHeight = '90vh';
                
                setTimeout(() => {
                    app.scrollTop = app.scrollHeight;
                }, 100);
            } else {
                app.style.overflowY = 'hidden';
                app.style.maxHeight = 'none';
            }
        }

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            if (newText.includes('HOORAY') || newText.includes('YIPPPEEEEEEEEEE')) {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 1600);
                
                gifContainer.style.animationDuration = '0.5s';
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                gifContainer.classList.add('heartbeat');
            } else {
                gifContainer.classList.remove('heartbeat');
            }
        }

        // Yes button click handler
        function yesClick() {
            // Randomly choose between two happy messages
            const messages = [
                "Hooray! You made me the happiest! 💖😊🎉",
                "YIPPPEEEEEEEEEE!!!!! <33333333 💘🎊🥳"
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            updateText(randomMessage);
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset everything
            noClickCount = 0;
            
            // Reset all styles
            yesButton.classList.remove('growing', 'full-width', 'overflowing');
            yesButton.style.fontSize = '18px';
            yesButton.style.padding = '15px 30px';
            yesButton.style.minHeight = '55px';
            yesButton.style.width = '';
            yesButton.style.height = '';
            yesButton.style.position = '';
            yesButton.style.top = '';
            yesButton.style.left = '';
            yesButton.style.right = '';
            yesButton.style.bottom = '';
            yesButton.style.zIndex = '';
            yesButton.style.borderRadius = '20px';
            yesButton.style.animation = '';
            yesButton.style.border = '3px solid #A5D6A7';
            yesButton.style.boxShadow = '0 5px 15px rgba(0, 0, 0, 0.2)';
            
            noButton.classList.remove('hidden', 'shrinking');
            noButton.style.display = 'flex';
            noButton.style.opacity = '1';
            noButton.style.transform = 'scale(1)';
            noButton.style.fontSize = '18px';
            noButton.style.padding = '15px 30px';
            noButton.style.minHeight = '55px';
            noButton.style.width = '';
            
            buttonsRow.style.flexDirection = 'row';
            buttonsRow.style.gap = '15px';
            buttonsRow.style.alignItems = 'center';
            
            // Reset message styles
            messageElement.style.fontSize = '22px';
            messageElement.style.padding = '12px 18px';
            messageElement.style.minHeight = '40px';
            
            gifContainer.style.opacity = '1';
            messageElement.style.opacity = '1';
            app.style.opacity = '1';
            footer.style.opacity = '1';
            
            updateButtonLayout();
            createCelebrationHearts();
        }

        // No button click handler
        function noClick() {
            const num = Math.min(noClickCount, sure.length - 1);
            updateText(sure[num]);
            
            noClickCount++;
            updateButtonLayout();
        }

        // Create celebration hearts
        function createCelebrationHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❤️'];
            
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.style.position = 'fixed';
                heart.style.fontSize = `${Math.random() * 25 + 20}px`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = '110%';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.color = '#ff69b4';
                heart.style.zIndex = '1000';
                heart.style.textShadow = '0 0 8px rgba(255, 20, 147, 0.5)';
                heart.style.pointerEvents = 'none';
                document.body.appendChild(heart);
                
                const animation = heart.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(-${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 1500 + 1500,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                animation.onfinish = () => {
                    heart.remove();
                };
            }
        }

        // Handle window resize
        function handleResize() {
            updateButtonLayout();
            ensureFooterVisibility();
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);
        window.addEventListener('resize', handleResize);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonLayout();
            createHearts();
            ensureFooterVisibility();
        });
    </script>
</body>
</html>
