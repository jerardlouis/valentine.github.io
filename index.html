<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            background: url('https://images2.alphacoders.com/135/1357958.png') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            position: relative;
            padding: 15px;
        }

        /* Overlay for better readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 182, 193, 0.7);
            backdrop-filter: blur(3px);
            z-index: 0;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 105, 180, 0.6);
            animation: float 10s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) translateX(0) rotate(0deg); 
                opacity: 0.8;
            }
            25% { 
                transform: translateY(-30px) translateX(10px) rotate(10deg); 
                opacity: 1;
            }
            50% { 
                transform: translateY(-15px) translateX(-10px) rotate(-5deg); 
                opacity: 0.9;
            }
            75% { 
                transform: translateY(-40px) translateX(5px) rotate(15deg); 
                opacity: 1;
            }
        }

        .App {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.95), rgba(255, 105, 180, 0.95));
            border-radius: 25px;
            padding: 20px;
            box-shadow: 
                0 0 40px rgba(255, 105, 180, 0.6),
                0 10px 30px rgba(255, 20, 147, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            border: 4px solid white;
            position: relative;
            z-index: 2;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .App::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #ff69b4, #ff1493, #ffb6c1, 
                #ff69b4, #ff1493, #ffb6c1);
            border-radius: 27px;
            z-index: -1;
            animation: glow 3s ease-in-out infinite alternate;
            filter: blur(10px);
            opacity: 0.7;
        }

        @keyframes glow {
            0% {
                opacity: 0.5;
                box-shadow: 0 0 30px rgba(255, 105, 180, 0.5);
            }
            100% {
                opacity: 0.8;
                box-shadow: 0 0 50px rgba(255, 20, 147, 0.7);
            }
        }

        .App-header {
            min-height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 10px;
        }

        /* Glowing box around the gif */
        .gif-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 25px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 0 0 4px white,
                0 0 0 8px rgba(255, 105, 180, 0.5),
                0 0 30px rgba(255, 20, 147, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.4);
            animation: gifGlow 2s ease-in-out infinite alternate;
            background: linear-gradient(45deg, #ffb6c1, #ff69b4, #ff1493);
            padding: 8px;
        }

        @keyframes gifGlow {
            0% {
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 8px rgba(255, 105, 180, 0.5),
                    0 0 25px rgba(255, 20, 147, 0.5),
                    inset 0 0 15px rgba(255, 255, 255, 0.3);
            }
            100% {
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 8px rgba(255, 105, 180, 0.7),
                    0 0 40px rgba(255, 20, 147, 0.8),
                    inset 0 0 25px rgba(255, 255, 255, 0.5);
            }
        }

        .App-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid white;
        }

        .message {
            font-size: 24px;
            margin-bottom: 25px;
            min-height: 40px;
            font-weight: bold;
            color: white;
            padding: 15px 20px;
            background: linear-gradient(45deg, rgba(255, 20, 147, 0.8), rgba(255, 105, 180, 0.8));
            border: 3px solid white;
            border-radius: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            align-items: center;
            width: 100%;
            transition: all 0.5s ease;
        }

        .buttons-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            transition: all 0.5s ease;
        }

        button {
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
        }

        button:active {
            transform: translateY(2px) scale(0.98);
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
            border-radius: 20px;
        }

        .yes {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: 3px solid #A5D6A7;
            order: 1;
        }

        .yes:hover {
            background: linear-gradient(135deg, #66BB6A, #388E3C);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .no {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
            border: 3px solid #EF9A9A;
            order: 2;
            opacity: 1;
            transition: all 0.5s ease;
        }

        .no:hover {
            background: linear-gradient(135deg, #EF5350, #D32F2F);
            box-shadow: 0 10px 25px rgba(244, 67, 54, 0.4);
        }

        .no.hidden {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .footer {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: white;
            width: 100%;
            background: linear-gradient(45deg, rgba(255, 20, 147, 0.8), rgba(255, 105, 180, 0.8));
            border-radius: 15px;
            border: 2px solid white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .footer a {
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .footer a:hover {
            color: #FFEBEE;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .seo {
            display: none;
        }

        .valentine-heart {
            font-size: 36px;
            margin-bottom: 10px;
            animation: heartbeat 1.5s infinite;
            color: white;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1.1); }
            75% { transform: scale(1.15); }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .App {
                padding: 15px;
                max-width: 95%;
                border-radius: 20px;
            }
            
            .gif-container {
                width: 200px;
                height: 200px;
                margin-bottom: 20px;
            }
            
            .message {
                font-size: 22px;
                padding: 12px 16px;
                margin-bottom: 20px;
                border-radius: 12px;
            }
            
            .buttons-row {
                gap: 15px;
            }
            
            .valentine-heart {
                font-size: 32px;
            }
            
            .footer {
                padding: 12px;
                font-size: 13px;
                margin-top: 20px;
                border-radius: 12px;
            }
        }

        @media (max-height: 700px) {
            .gif-container {
                width: 180px;
                height: 180px;
            }
            
            .message {
                font-size: 20px;
                margin-bottom: 15px;
                padding: 10px 14px;
            }
            
            .buttons-container {
                margin-top: 15px;
            }
            
            .footer {
                margin-top: 15px;
                padding: 10px;
            }
        }

        /* Animation for the HOORAY message */
        @keyframes hooray {
            0% { 
                transform: scale(1); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.8), rgba(255, 105, 180, 0.8));
            }
            25% { 
                transform: scale(1.3) rotate(-5deg); 
                background: linear-gradient(45deg, rgba(255, 105, 180, 0.9), rgba(255, 20, 147, 0.9));
            }
            50% { 
                transform: scale(1.2) rotate(5deg); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.9), rgba(255, 182, 193, 0.9));
            }
            75% { 
                transform: scale(1.3) rotate(-5deg); 
                background: linear-gradient(45deg, rgba(255, 182, 193, 0.9), rgba(255, 105, 180, 0.9));
            }
            100% { 
                transform: scale(1); 
                background: linear-gradient(45deg, rgba(255, 20, 147, 0.8), rgba(255, 105, 180, 0.8));
            }
        }

        .hooray {
            animation: hooray 0.8s ease-in-out 2;
            color: white;
        }

        /* Heart pulse animation for the logo when yes is clicked */
        @keyframes logoHeartbeat {
            0% { 
                transform: scale(1); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 8px rgba(255, 105, 180, 0.5),
                    0 0 25px rgba(255, 20, 147, 0.5),
                    inset 0 0 15px rgba(255, 255, 255, 0.3);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 8px rgba(255, 105, 180, 0.8),
                    0 0 40px rgba(255, 20, 147, 0.8),
                    inset 0 0 25px rgba(255, 255, 255, 0.5);
            }
            100% { 
                transform: scale(1); 
                box-shadow: 
                    0 0 0 4px white,
                    0 0 0 8px rgba(255, 105, 180, 0.5),
                    0 0 25px rgba(255, 20, 147, 0.5),
                    inset 0 0 15px rgba(255, 255, 255, 0.3);
            }
        }

        .heartbeat {
            animation: logoHeartbeat 1s infinite;
        }
    </style>
</head>
<body>
    <div class="hearts" id="heartsContainer"></div>
    
    <div class="App">
        <header class="App-header">
            <div class="valentine-heart">💖</div>
            <div class="gif-container">
                <img id="logo" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif" class="App-logo" alt="Hello Kitty Valentine">
            </div>
            <p id="message" class="message">Will you be my valentine? 💕</p>
            <div class="buttons-container" id="buttonsContainer">
                <div class="buttons-row" id="buttonsRow">
                    <button id="yesButton" class="yes">
                        Yes 💖
                    </button>
                    <button id="noButton" class="no">
                        No 💔
                    </button>
                </div>
            </div>
        </header>
        
        <div class="footer">
            <a href="http://jerardlouis.github.io">
                <small>
                    💖 By Jerard Louis Dayanghirang Guevarra
                    <br/>
                    Click here to find me online!
                </small>
            </a>
            <br/>
            <small class="seo">
                An app by Jerard Louis Dayanghirang Guevarra, software engineer and musician. 
                @jerardlouis Jerard Louis Dayanghirang Guevarra @jerardlouis
            </small>
        </div>
    </div>

    <script>
        // State variables
        let text = 'Will you be my valentine? 💕';
        let img = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExOWphMHVqczg1NHFocDN5bGk3a2Mzd2t4cnpzdGtzcjBjbDVhcjdmeSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/SoZAMdHWldHbQHLCGZ/giphy.gif";
        let yesSize = 18;
        let noSize = 18;
        let noClickCount = 0;
        const sure = [
            "Are you sure? 💔", 
            "Really sure? 😢", 
            "Really REALLY sure??? 😭", 
            "SURE you're sure??? 💔😭",
            "Pretty please? 🥺",
            "I'll be so sad... 😞",
            "My heart is breaking... 💔",
            "Last chance... 🙏"
        ];

        // DOM elements
        const messageElement = document.getElementById('message');
        const logoElement = document.getElementById('logo');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const buttonsRow = document.getElementById('buttonsRow');
        const gifContainer = document.querySelector('.gif-container');
        const heartsContainer = document.getElementById('heartsContainer');

        // Create floating hearts
        function createHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❣️', '❤️', '🧡', '💛', '💚', '💙', '💜'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 8}s`;
                heart.style.fontSize = `${Math.random() * 20 + 15}px`;
                heart.style.animationDuration = `${Math.random() * 5 + 8}s`;
                heartsContainer.appendChild(heart);
            }
        }

        // Update button sizes and layout
        function updateButtonLayout() {
            // Cap maximum sizes for mobile
            const maxYesSize = window.innerWidth < 480 ? 36 : 42;
            
            // Calculate sizes
            const currentYesSize = Math.min(yesSize, maxYesSize);
            const currentNoSize = Math.max(12, 18 - (yesSize - 18) / 3);
            
            // Update Yes button
            yesButton.style.fontSize = `${currentYesSize}px`;
            yesButton.style.padding = `${currentYesSize * 0.8}px ${currentYesSize * 1.5}px`;
            yesButton.style.minWidth = `${currentYesSize * 6}px`;
            yesButton.style.minHeight = `${currentYesSize * 2.2}px`;
            
            // Update No button
            noButton.style.fontSize = `${currentNoSize}px`;
            noButton.style.padding = `${currentNoSize * 0.8}px ${currentNoSize * 1.5}px`;
            noButton.style.minWidth = `${currentNoSize * 6}px`;
            noButton.style.minHeight = `${currentNoSize * 2.2}px`;
            
            // Update message font size to match yes button
            messageElement.style.fontSize = `${Math.min(28, currentYesSize + 6)}px`;
            
            // Check if Yes button is getting too large
            const yesButtonWidth = currentYesSize * 6;
            const containerWidth = buttonsRow.offsetWidth;
            
            // If Yes button takes more than 50% of container width, move No button below
            if (yesButtonWidth > containerWidth * 0.5) {
                buttonsRow.style.flexDirection = 'column';
                buttonsRow.style.gap = '25px';
                buttonsRow.style.alignItems = 'center';
                
                // Center Yes button and put No button below
                yesButton.style.order = 1;
                noButton.style.order = 2;
                
                // If Yes button is very large, start fading No button
                if (yesButtonWidth > containerWidth * 0.7) {
                    noButton.style.opacity = '0.6';
                    noButton.style.transform = 'scale(0.85)';
                }
                
                // If Yes button is almost filling container, hide No button
                if (yesButtonWidth > containerWidth * 0.9 || noClickCount >= 7) {
                    noButton.classList.add('hidden');
                }
            } else {
                // Reset to side-by-side layout
                buttonsRow.style.flexDirection = 'row';
                buttonsRow.style.gap = '20px';
                noButton.style.opacity = '1';
                noButton.style.transform = 'scale(1)';
                noButton.classList.remove('hidden');
            }
        }

        // Function to update the message text
        function updateText(newText) {
            text = newText;
            messageElement.textContent = text;
            
            // Add animation for HOORAY message
            if (newText.includes('HOORAY')) {
                messageElement.classList.add('hooray');
                setTimeout(() => {
                    messageElement.classList.remove('hooray');
                }, 1600);
                
                // Make gif container glow more
                gifContainer.style.animationDuration = '0.5s';
            }
        }

        // Function to update the image
        function updateImg(newImg) {
            img = newImg;
            logoElement.src = img;
            
            // Add animation when yes is clicked
            if (newImg === "https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif") {
                gifContainer.classList.add('heartbeat');
            } else {
                gifContainer.classList.remove('heartbeat');
            }
        }

        // Yes button click handler
        function yesClick() {
            updateText('HOORAY! You made me the happiest! 💖😊🎉');
            updateImg("https://i.pinimg.com/originals/14/12/a6/1412a602c0cd0027a7c494967a564e7e.gif");
            
            // Reset button sizes and layout
            yesSize = 18;
            noClickCount = 0;
            updateButtonLayout();
            
            // Create celebration effect
            createCelebrationHearts();
        }

        // No button click handler
        function noClick() {
            const num = Math.min(noClickCount, sure.length - 1);
            updateText(sure[num]);
            
            // Yes button gets bigger
            yesSize += 10;
            noClickCount++;
            
            updateButtonLayout();
            
            // If No button is hidden, show a sad message
            if (noButton.classList.contains('hidden')) {
                updateText("Oh no... 💔😭 Please reconsider... 🥺🌸");
            }
        }

        // Create celebration hearts
        function createCelebrationHearts() {
            const hearts = ['💖', '💗', '💓', '💞', '💕', '❤️'];
            const colors = ['#ff1493', '#ff69b4', '#ffb6c1', '#ff4081', '#f48fb1'];
            
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.style.position = 'fixed';
                heart.style.fontSize = `${Math.random() * 30 + 25}px`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = '110%';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.zIndex = '1000';
                heart.style.textShadow = '0 0 15px currentColor';
                heart.style.pointerEvents = 'none';
                document.body.appendChild(heart);
                
                // Animate heart floating up
                const animation = heart.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(-${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 3000,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                // Remove heart after animation
                animation.onfinish = () => {
                    heart.remove();
                };
            }
        }

        // Handle window resize
        function handleResize() {
            updateButtonLayout();
        }

        // Add event listeners
        yesButton.addEventListener('click', yesClick);
        noButton.addEventListener('click', noClick);
        window.addEventListener('resize', handleResize);

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            updateText(text);
            updateImg(img);
            updateButtonLayout();
            createHearts();
        });
    </script>
</body>
</html>
